<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="164" viewBox="0 0 1280 164" role="img">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06131B"/><stop offset=".57" stop-color="#071017"/><stop offset="1" stop-color="#041017"/></linearGradient>
<linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0D5C63"/><stop offset="1" stop-color="#35CDD2"/></linearGradient>
<linearGradient id="soft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10232D"/><stop offset="1" stop-color="#07141D"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#0C8A97" stop-opacity=".32"/><stop offset="1" stop-color="#0C8A97" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M 36 0 L 0 0 0 36" fill="none" stroke="#244B58" stroke-opacity=".23" stroke-width=".8"/></pattern>
<style>
 .ui{font-family:Inter,Arial,sans-serif}
 .mono{font-family:DejaVu Sans Mono,monospace}
 .tiny{font-size:14px;font-weight:700;letter-spacing:2px;fill:#69BEC5}
 .sm{font-size:16px;fill:#A2BAC5}
